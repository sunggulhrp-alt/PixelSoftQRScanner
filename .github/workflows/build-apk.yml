name: Build PixelSoft QR Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -o PixelSoftQRScanner_Project_v1.3_FINAL.zip -d extracted
      - name: Build debug APK
        working-directory: extracted/PixelSoftQRScanner
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelSoftQRScanner-v1.3-debug
          path: extracted/PixelSoftQRScanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
